apiVersion: v1
kind: Service
metadata:
  name: terminal-share
  namespace: {{ .Release.Namespace }}
  labels:
    app: terminal-share
spec:
  type: ClusterIP
  selector:
    app: terminal-share
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort | quote }}
      protocol: TCP
