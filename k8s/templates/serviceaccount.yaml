apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | quote }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.serviceAccount.clientId }}
  annotations:
    # The workload identity webhook gives pods of this account a token for
    # terminal-share-identity, which may write the snapshots container (tofu).
    azure.workload.identity/client-id: {{ .Values.serviceAccount.clientId | quote }}
  {{- end }}
