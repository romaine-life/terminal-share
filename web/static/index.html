<body>
  <header>
    <h1>terminal-share</h1>
  </header>
  <main class="about">
    <p>A home PC's terminal window, shared as a link. Each link shows what the window
      held when it was shared, in the terminal's own font and colors, and stops working
      30 days later.</p>
    <p>Links look like <code>share.romaine.life/s/…</code>; there is nothing to browse here.</p>
  </main>
